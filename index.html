<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaibhav Satish - Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #090a0f;
        --card-bg: rgba(20, 21, 33, 0.55);
        --accent-code: #00ff88;
        --accent-code-glow: rgba(0, 255, 136, 0.22);
        --accent-human: #ffb454;
        --accent-human-glow: rgba(255, 180, 84, 0.22);
        --accent-blue: #00eeff;
        --accent-blue-glow: rgba(0, 238, 255, 0.22);
        --accent-red: #ff5f56;
        --accent-red-glow: rgba(255, 95, 86, 0.22);
        --text-main: #ededf4;
        --text-muted: #8c8fa3;
        --border-color: rgba(255, 255, 255, 0.12);
        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        --font-body: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: var(--font-body);
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100%;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
    }

    #particle-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
    }

    /* ---------- Nav ---------- */
    header.site-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.5rem 2.5rem;
        position: relative;
        z-index: 10;
    }

    .logo {
        font-family: var(--font-mono);
        font-size: 1.05rem;
        color: var(--accent-code);
        letter-spacing: 0.5px;
    }

    nav.links { display: flex; gap: 2rem; }

    nav.links a {
        position: relative;
        text-decoration: none;
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 0.85rem;
        letter-spacing: 0.3px;
        padding-bottom: 4px;
        transition: color 0.2s ease;
    }

    nav.links a::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0%;
        height: 1.5px;
        background: var(--accent-code);
        transition: width 0.25s ease;
    }

    nav.links a:hover { color: var(--text-main); }
    nav.links a:hover::after { width: 100%; }
    nav.links a.active { color: var(--accent-code); }
    nav.links a.active::after { width: 100%; }

    /* ---------- Hero ---------- */
    main.hero {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4rem;
        max-width: 1100px;
        width: 92%;
        margin: 0 auto;
        padding: 2rem 1rem 3rem 1rem;
        position: relative;
        z-index: 10;
        flex-wrap: wrap;
    }

    .hero-text {
        flex: 1 1 380px;
        max-width: 480px;
        text-align: left;
    }

    .eyebrow {
        font-family: var(--font-mono);
        color: var(--accent-code);
        font-size: 0.9rem;
        margin: 0 0 0.9rem 0;
        opacity: 0.9;
    }

    h1.name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 2.9rem;
        line-height: 1.1;
        letter-spacing: -0.5px;
        margin: 0 0 1.1rem 0;
    }

    h1.name .accent { color: var(--accent-human); }

    p.tagline {
        font-family: var(--font-body);
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1.6;
        margin: 0 0 2rem 0;
    }

    .cta-row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .btn {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        text-decoration: none;
        padding: 0.85rem 1.4rem;
        border-radius: 10px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        display: inline-block;
    }

    .btn-primary {
        background: var(--accent-code);
        color: #05130c;
        font-weight: 600;
    }

    .btn-primary-resume {
        background: rgb(0, 238, 255);
        color: #05130c;
        font-weight: 600;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px var(--accent-code-glow);
    }

    .btn-outline {
        border: 1px solid var(--accent-human);
        color: var(--accent-human);
    }

    .btn-outline:hover {
        transform: translateY(-2px);
        background: var(--accent-human-glow);
    }

    /* ---------- Terminal card (signature element) ---------- */
    .terminal-card {
        flex: 1 1 340px;
        max-width: 400px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 45px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
    }

    .terminal-tabs {
        display: flex;
        border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        padding: 0.8rem 0.3rem;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: color 0.2s ease, border-color 0.2s ease;
    }

    .tab-btn.active { color: var(--text-main); }

    .terminal-body {
        padding: 1.6rem 1.5rem;
        font-family: var(--font-mono);
        font-size: 0.88rem;
        line-height: 1.7;
        color: var(--text-main);
        min-height: 140px;
        text-align: left;
    }

    .terminal-body .comment { color: var(--text-muted); }
    .terminal-body .cursor {
        display: inline-block;
        width: 7px;
        height: 1em;
        background: currentColor;
        margin-left: 2px;
        vertical-align: text-bottom;
        animation: blink 1s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- Footer ---------- */
    footer {
        text-align: center;
        padding: 1.5rem 0 2rem 0;
        font-family: var(--font-mono);
        color: var(--text-muted);
        font-size: 0.8rem;
        position: relative;
        z-index: 10;
    }

    @media (max-width: 720px) {
        header.site-nav { padding: 1.2rem 1.5rem; }
        h1.name { font-size: 2.2rem; }
        main.hero { gap: 2rem; text-align: center; }
        .hero-text { text-align: center; }
        .cta-row { justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; }
    }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<header class="site-nav">
    <a href="index.html" class="logo">&lt;VS/&gt;</a>
    <nav class="links">
        <a href="index.html" class="active">Home</a>
        <a href="Projects.html">Projects</a>
        <a href="Resume.html">Resume</a>
        <a href="Contact.html">Contact</a>
    </nav>
</header>

<main class="hero">
    <div class="hero-text">
        <p class="eyebrow">// hello, i'm</p>
        <h1 class="name">Vaibhav Adithya <span class="accent">Satish</span></h1>
        <p class="tagline">Software developer who spends the rest of the time chasing scores on the field and melodies on repeat. I build things, mostly on purpose.</p>
        <div class="cta-row">
            <a href="Projects.html" class="btn btn-primary">View Projects</a>
            <a href="Resume.html" class="btn btn-primary-resume"> View my Experiences</a>
            <a href="Contact.html" class="btn btn-outline">Get in Touch</a>
        </div>
    </div>

    <div class="terminal-card">
        <div class="terminal-tabs" id="terminal-tabs"></div>
        <div class="terminal-body" id="terminal-body"></div>
    </div>
</main>

<footer>&copy; 2025 Vaibhav Satish</footer>

<script>
    // ---------- Particle Background ----------
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particlesArray;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const mouse = { x: null, y: null, radius: 150 };
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseout', () => { mouse.x = undefined; mouse.y = undefined; });

    class Particle {
        constructor(x, y, dx, dy, size) {
            this.x = x; this.y = y; this.directionX = dx; this.directionY = dy; this.size = size;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
            ctx.fillStyle = 'rgba(0, 255, 136, 0.7)';
            ctx.fill();
        }
        update() {
            if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
            if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
            this.x += this.directionX;
            this.y += this.directionY;
            this.draw();
        }
    }

    function initParticles() {
        particlesArray = [];
        let numberOfParticles = (canvas.width * canvas.height) / 9500;
        for (let i = 0; i < numberOfParticles; i++) {
            let size = (Math.random() * 2) + 1;
            let x = Math.random() * (canvas.width - size * 2) + size;
            let y = Math.random() * (canvas.height - size * 2) + size;
            let dx = (Math.random() * 0.6) - 0.3;
            let dy = (Math.random() * 0.6) - 0.3;
            particlesArray.push(new Particle(x, y, dx, dy, size));
        }
    }

    function connectParticles() {
        for (let a = 0; a < particlesArray.length; a++) {
            for (let b = a + 1; b < particlesArray.length; b++) {
                let dist = ((particlesArray[a].x - particlesArray[b].x) ** 2) + ((particlesArray[a].y - particlesArray[b].y) ** 2);
                if (dist < (canvas.width / 8) * (canvas.height / 8)) {
                    let opacity = 1 - (dist / 15000);
                    ctx.strokeStyle = `rgba(0, 255, 136, ${opacity * 0.28})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                    ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                    ctx.stroke();
                }
            }
            if (mouse.x !== undefined) {
                let mDist = ((particlesArray[a].x - mouse.x) ** 2) + ((particlesArray[a].y - mouse.y) ** 2);
                if (mDist < mouse.radius * mouse.radius) {
                    let mOpacity = 1 - (mDist / (mouse.radius * mouse.radius));
                    ctx.strokeStyle = `rgba(255, 180, 84, ${mOpacity * 0.5})`;
                    ctx.lineWidth = 1.1;
                    ctx.beginPath();
                    ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                }
            }
        }
    }

    function animateParticles() {
        requestAnimationFrame(animateParticles);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particlesArray.forEach(p => p.update());
        connectParticles();
    }

    initParticles();
    animateParticles();

    // ---------- Terminal Tabs (signature element) ----------
    const facets = [
        {
            tab: 'sports.ts',
            color: 'var(--accent-human)', // Orange
            lines: [
                { comment: '// currently invested in' },
                { text: 'const team = "Seattle Seahawks";' },
                { text: 'watch(team.everyGame);' }
            ]
        },
        {
            tab: 'music.ts',
            color: 'var(--accent-code)', // Green
            lines: [
                { comment: '// plays' },
                { text: 'const instrument = "Drumset";' },
                { text: 'practice(instrument, daily=true);' }
            ]
        },
        {
            tab: 'listening.ts',
            color: 'var(--accent-blue)', // Blue
            lines: [
                { comment: '// on repeat this week' },
                { text: 'const playlist = "Any Song, Any Genre, Any Language!";' },
                { text: 'play(playlist, volume=loud);' }
            ]
        },
        {
            tab: 'dev.ts',
            color: 'var(--accent-red)', // Red
            lines: [
                { comment: '// building right now' },
                { text: 'console.log("shipping something new");' },
                { text: 'status: "in progress";' }
            ]
        }
    ];

    const tabsEl = document.getElementById('terminal-tabs');
    const bodyEl = document.getElementById('terminal-body');
    let activeIndex = 0;
    let typingTimeout = null;
    let cycleInterval = null;

    function renderTabs() {
        tabsEl.innerHTML = facets.map((f, i) => {
            const active = i === activeIndex;
            const color = f.color;
            return `<button class="tab-btn${active ? ' active' : ''}" style="border-color:${active ? color : 'transparent'}" data-index="${i}">${f.tab}</button>`;
        }).join('');

        tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeIndex = parseInt(btn.dataset.index);
                renderTabs();
                startTypingAnimation();
                restartCycle();
            });
        });
    }

    function startTypingAnimation() {
        if (typingTimeout) clearTimeout(typingTimeout);

        const facet = facets[activeIndex];
        const color = facet.color;
        
        let currentLineIndex = 0;
        let currentCharIndex = 0;
        let renderedLines = [];

        function typeStep() {
            if (currentLineIndex >= facet.lines.length) return;

            const lineObj = facet.lines[currentLineIndex];
            
            if (lineObj.comment) {
                // Comments appear instantly line by line
                renderedLines.push({ type: 'comment', text: lineObj.comment });
                currentLineIndex++;
                currentCharIndex = 0;
                updateDOM(renderedLines, currentLineIndex < facet.lines.length, color);
                typingTimeout = setTimeout(typeStep, 150);
            } else {
                // Code lines type out character by character
                const textToType = lineObj.text;
                const partialText = textToType.substring(0, currentCharIndex + 1);
                
                // Build current state of lines
                let tempLines = [...renderedLines];
                tempLines.push({ type: 'code', text: partialText });
                
                currentCharIndex++;
                const isLineFinished = currentCharIndex > textToType.length;

                updateDOM(tempLines, true, color);

                if (isLineFinished) {
                    renderedLines.push({ type: 'code', text: textToType });
                    currentLineIndex++;
                    currentCharIndex = 0;
                    typingTimeout = setTimeout(typeStep, 250); // Pause briefly before next line
                } else {
                    typingTimeout = setTimeout(typeStep, 35); // Typing speed per character
                }
            }
        }

        // Initial blank start before typing
        updateDOM([], true, color);
        typingTimeout = setTimeout(typeStep, 100);
    }

    function updateDOM(lines, showCursor, color) {
        bodyEl.innerHTML = lines.map((l, i) => {
            const isLast = i === lines.length - 1;
            const cursorHtml = (isLast && showCursor) ? `<span class="cursor" style="color:${color}"></span>` : '';
            
            if (l.type === 'comment') {
                return `<div class="comment">${l.text}</div>`;
            }
            return `<div style="color:${color}">${l.text}${cursorHtml}</div>`;
        }).join('') + (lines.length === 0 && showCursor ? `<div style="color:${color}"><span class="cursor" style="color:${color}"></span></div>` : '');
    }

    function restartCycle() {
        if (cycleInterval) clearInterval(cycleInterval);
        cycleInterval = setInterval(() => {
            activeIndex = (activeIndex + 1) % facets.length;
            renderTabs();
            startTypingAnimation();
        }, 4500);
    }

    // Initial load
    renderTabs();
    startTypingAnimation();
    restartCycle();
</script>
</body>
</html>
