<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaibhav Satish - Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #090a0f;
        --header-bg: #0d0e15;
        --card-bg: rgba(20, 21, 33, 0.65);
        --accent-code: #00ff88;
        --accent-code-glow: rgba(0, 255, 136, 0.22);
        --accent-human: #ffb454;
        --accent-human-glow: rgba(255, 180, 84, 0.22);
        --text-main: #ededf4;
        --text-muted: #8c8fa3;
        --border-color: rgba(255, 255, 255, 0.08);
        --border-glow: rgba(0, 255, 136, 0.35);
        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        --font-body: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-body);
    }

    /* ---------- Nav (shared across site) ---------- */
    header.site-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.5rem 2.5rem;
        background: var(--header-bg);
        border-bottom: 1px solid var(--border-color);
    }

    .logo {
        font-family: var(--font-mono);
        font-size: 1.05rem;
        color: var(--accent-code);
        letter-spacing: 0.5px;
        text-decoration: none;
    }

    nav.links { display: flex; gap: 2rem; }

    nav.links a {
        position: relative;
        text-decoration: none;
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 0.85rem;
        letter-spacing: 0.3px;
        padding-bottom: 4px;
        transition: color 0.2s ease;
    }

    nav.links a::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0%;
        height: 1.5px;
        background: var(--accent-code);
        transition: width 0.25s ease;
    }

    nav.links a:hover { color: var(--text-main); }
    nav.links a:hover::after { width: 100%; }

    nav.links a.active {
        color: var(--accent-code);
    }

    nav.links a.active::after {
        width: 100%;
    }

    /* ---------- Page header ---------- */
    .page-header {
        max-width: 1000px;
        width: 90%;
        margin: 3rem auto 0 auto;
        padding: 0 1rem;
    }

    .eyebrow {
        font-family: var(--font-mono);
        color: var(--accent-code);
        font-size: 0.9rem;
        margin: 0 0 0.7rem 0;
    }

    h1.page-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 2.6rem;
        letter-spacing: -0.5px;
        margin: 0 0 0.8rem 0;
    }

    .intro-text {
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1.6;
        max-width: 560px;
        margin: 0 0 1rem 0;
    }

    /* ---------- Layout ---------- */
    main {
        max-width: 1000px;
        width: 90%;
        margin: 2rem auto 4rem auto;
        padding: 0 1rem;
        flex: 1;
        display: flex;
        gap: 3rem;
        flex-wrap: wrap;
        align-items: flex-start;
    }

    .contact-side {
        flex: 1 1 260px;
        max-width: 300px;
        text-align: center;
    }

    img.profile-pic {
        width: 220px;
        height: 220px;
        border-style: solid;
        border-width: 2px;
        border-color: var(--border-color);
        border-radius: 50%;
        object-fit: cover;
        display: block;
        margin: 0 auto 1.5rem auto;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .contact-side p {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0 0 1.5rem 0;
    }

    .social-links {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.6rem;
    }

    .social-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
    }

    .social-links a img {
        width: 28px;
        height: 28px;
        filter: invert(75%) sepia(30%) saturate(800%) hue-rotate(90deg) brightness(95%) contrast(100%);
        transition: opacity 0.2s ease;
    }

    .social-links a:hover { transform: scale(1.15); }
    .social-links a:hover img { opacity: 0.8; }

    /* ---------- Form ---------- */
    form {
        flex: 2 1 380px;
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
    }

    form label {
        font-family: var(--font-mono);
        color: var(--text-muted);
        font-size: 0.78rem;
        letter-spacing: 0.3px;
        display: block;
        margin-bottom: 6px;
        text-align: left;
    }

    form input, form textarea {
        width: 100%;
        padding: 12px 14px;
        margin: 0 0 18px 0;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background-color: rgba(9, 10, 15, 0.8);
        color: var(--text-main);
        font-family: var(--font-body);
        font-size: 0.95rem;
        display: block;
        resize: none;
    }

    form textarea { min-height: 120px; }

    form input:focus, form textarea:focus {
        outline: none;
        border-color: var(--border-glow);
        box-shadow: 0 0 15px var(--accent-code-glow);
    }

    form button {
        padding: 12px 26px;
        border-radius: 10px;
        background-color: var(--accent-code);
        color: #05130c;
        font-weight: 600;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        cursor: pointer;
        border: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        display: block;
        margin: 0 auto;
    }

    form button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px var(--accent-code-glow);
    }

    #form-success {
        color: var(--accent-code);
        font-family: var(--font-mono);
        font-size: 0.85rem;
        margin-top: 1rem;
        display: none;
        text-align: center;
    }

    footer {
        background-color: var(--header-bg);
        width: 100%;
        text-align: center;
        padding: 2rem 0;
        font-family: var(--font-mono);
        color: var(--text-muted);
        font-size: 0.8rem;
        border-top: 1px solid var(--border-color);
    }

    @media (max-width: 720px) {
        header.site-nav { padding: 1.2rem 1.5rem; }
        h1.page-title { font-size: 2.1rem; }
        main { flex-direction: column; align-items: center; text-align: center; }
        form { width: 100%; }
    }
</style>
</head>
<body>

<header class="site-nav">
    <a href="index.html" class="logo">&lt;VS/&gt;</a>
    <nav class="links">
        <a href="index.html">Home</a>
        <a href="Projects.html">Projects</a>
        <a href="Resume.html">Resume</a>
        <a href="Contact.html" class="active">Contact</a>
    </nav>
</header>

<div class="page-header">
    <p class="eyebrow">// let's talk</p>
    <h1 class="page-title">Get in Touch</h1>
    <p class="intro-text">Have a project, an opportunity, or just want to say hi? Send a message and I'll get back to you.</p>
</div>

<main>
    <div class="contact-side">
        <img class="profile-pic" src="IMG_3762.jpg" alt="Vaibhav Satish">
        <p>Based in the Bay Area. Always open to interesting conversations.</p>
        <div class="social-links">
            <a href="https://github.com/VaibhavSatish" target="_blank" title="GitHub">
                <img src="https://api.iconify.design/mdi:github.svg" alt="GitHub">
            </a>
            <a href="https://www.linkedin.com/in/vaibhav-adithya-satish" target="_blank" title="LinkedIn">
                <img src="https://api.iconify.design/mdi:linkedin.svg" alt="LinkedIn">
            </a>
            <a href="https://www.instagram.com/vaibhav_satish_/" target="_blank" title="Instagram">
                <img src="https://api.iconify.design/mdi:instagram.svg" alt="Instagram">
            </a>
        </div>
    </div>

    <form action="https://formspree.io/f/xldlkyyo" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
        <div id="form-success">Thanks — your message has been sent.</div>
    </form>
</main>

<footer>&copy; 2025 Vaibhav Satish</footer>

<script>
    const form = document.querySelector("form");
    form.addEventListener("submit", (e) => {
        e.preventDefault();
        const data = new FormData(form);
        fetch(form.action, {
            method: form.method,
            body: data,
            headers: { 'Accept': 'application/json' }
        }).then(response => {
            if (response.ok) {
                document.getElementById("form-success").style.display = "block";
                form.reset();
            } else {
                alert("Oops! There was a problem submitting your form.");
            }
        }).catch(() => alert("Oops! There was a problem submitting your form."));
    });
</script>

</body>
</html>
